name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  caddy-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install distribution Caddy validator
        run: |
          sudo apt-get update
          sudo apt-get install -y caddy nftables iproute2
      - name: Validate closed bootstrap profile and protected admin reads
        run: env DP_TEST_CADDY_PROFILE=1 node --test test/release-clean-caddy-config.test.js
      - name: Bind real non-root Caddy, systemd and isolated host ingress
        run: |
          sudo ip netns add dp-clean-caddy-ci
          trap 'sudo ip netns del dp-clean-caddy-ci' EXIT
          sudo ip -n dp-clean-caddy-ci link set lo up
          sudo ip -n dp-clean-caddy-ci link add dp-public-test type dummy
          sudo ip -n dp-clean-caddy-ci addr add 1.1.1.1/32 dev dp-public-test
          sudo ip -n dp-clean-caddy-ci link set dp-public-test up
          sudo ip netns exec dp-clean-caddy-ci env "PATH=$PATH" "SUDO_UID=$(id -u)" "SUDO_GID=$(id -g)" DP_TEST_CADDY_NETNS=/run/netns/dp-clean-caddy-ci DP_TEST_REAL_CADDY_PROCESS=1 node --test test/release-real-clean-caddy-process.test.js

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  tmux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux acl
      - run: npm ci
      - name: Agent and tmux lifecycle smoke
        run: npm run test:integration:tmux

  systemd-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux acl
      - run: npm ci
      - name: Root-only pinned release preparation
        run: sudo env "PATH=$PATH" DP_TEST_REAL_CHOWN=1 node --test test/release-trust-key.test.js test/release-prepare.test.js test/release-prepare-first-migration.test.js test/release-prepare-clean-install.test.js test/release-clean-install-config-staging.test.js test/release-stage-legacy-counter-hotfix.test.js test/release-preflight-legacy-counter-hotfix.test.js test/release-install-legacy-counter-hotfix.test.js
      - name: Signed release dependency preparation
        run: sudo env "PATH=$PATH" DP_TEST_REAL_DEPENDENCIES=1 node --test test/release-prepare.test.js
      - name: Disposable complete signed private installation controller
        run: sudo env "PATH=$PATH" DP_TEST_REAL_PRIVATE_INSTALL=1 node --test test/release-real-clean-private-install.test.js
      - name: Disposable signed private OAuth configuration and credential separation
        run: sudo env "PATH=$PATH" DP_TEST_REAL_PRIVATE_INSTALL=1 DP_TEST_REAL_CLEAN_OAUTH_STAGING=1 node --test test/release-real-clean-private-install.test.js
      - name: Disposable actual signed application startup and deliberate recovery
        run: |
          sudo systemctl set-environment "PATH=$PATH"
          trap 'sudo systemctl unset-environment PATH' EXIT
          sudo env "PATH=$PATH" DP_TEST_REAL_PRIVATE_INSTALL=1 DP_TEST_REAL_CLEAN_STARTUP=1 node --test test/release-real-clean-private-install.test.js
      - name: Disposable signed OAuth owner bootstrap recovery and actual paused startup
        run: |
          sudo systemctl set-environment "PATH=$PATH"
          trap 'sudo systemctl unset-environment PATH' EXIT
          sudo env "PATH=$PATH" DP_TEST_REAL_PRIVATE_INSTALL=1 DP_TEST_REAL_CLEAN_OAUTH_STAGING=1 DP_TEST_REAL_CLEAN_OAUTH_OWNER=1 DP_TEST_REAL_CLEAN_STARTUP=1 node --test test/release-real-clean-private-install.test.js
      - name: Disposable composed fresh OAuth owner installation and actual paused startup
        run: |
          sudo systemctl set-environment "PATH=$PATH"
          trap 'sudo systemctl unset-environment PATH' EXIT
          sudo env "PATH=$PATH" DP_TEST_REAL_PRIVATE_INSTALL=1 DP_TEST_REAL_CLEAN_OAUTH_STAGING=1 DP_TEST_REAL_CLEAN_OAUTH_OWNER=1 DP_TEST_REAL_CLEAN_OAUTH_COMPOSED=1 DP_TEST_REAL_CLEAN_STARTUP=1 node --test test/release-real-clean-private-install.test.js
      - name: Disposable protected private installation request and full signed owner entry
        run: |
          sudo systemctl set-environment "PATH=$PATH"
          trap 'sudo systemctl unset-environment PATH' EXIT
          sudo env "PATH=$PATH" DP_TEST_REAL_PRIVATE_INSTALL=1 DP_TEST_REAL_CLEAN_OAUTH_STAGING=1 DP_TEST_REAL_CLEAN_OAUTH_OWNER=1 DP_TEST_REAL_CLEAN_OAUTH_COMPOSED=1 DP_TEST_REAL_CLEAN_PRIVATE_ENTRY=1 DP_TEST_REAL_CLEAN_STARTUP=1 node --test test/release-clean-private-entry.test.js test/release-clean-install-route.test.js test/release-real-clean-private-install.test.js
      - name: Disposable signed Direct autonomy with effective application egress denial
        run: |
          sudo systemctl set-environment "PATH=$PATH"
          trap 'sudo systemctl unset-environment PATH' EXIT
          sudo env "PATH=$PATH" DP_TEST_REAL_PRIVATE_INSTALL=1 DP_TEST_REAL_CLEAN_OAUTH_STAGING=1 DP_TEST_REAL_CLEAN_OAUTH_OWNER=1 DP_TEST_REAL_CLEAN_OAUTH_COMPOSED=1 DP_TEST_REAL_CLEAN_PRIVATE_ENTRY=1 DP_TEST_REAL_CLEAN_STARTUP=1 DP_TEST_REAL_PRIVATE_AUTONOMY=1 node --test test/release-real-clean-private-install.test.js
      - name: Root-only grouped state snapshot and restore
        run: sudo env "PATH=$PATH" node --test test/release-state-bundle.test.js
      - name: Root-only admission pause and verified resume
        run: sudo env "PATH=$PATH" node --test test/release-admission-gate.test.js
      - name: Root-only first-migration systemd snapshot
        run: sudo env "PATH=$PATH" node --test test/release-unit-backup.test.js test/release-unit-backup-verification.test.js test/release-ingress-boot-guard.test.js test/release-installed-ingress-guard-preflight.test.js test/release-legacy-service-activity.test.js test/release-migration-journal.test.js test/release-migration-recovery.test.js test/release-close-legacy-ingress.test.js
      - name: Root-only legacy writer quiescence
        run: sudo env "PATH=$PATH" node --test test/release-quiesce-legacy-writers.test.js test/release-instrumented-legacy-drain.test.js
      - name: Root-only journaled grouped snapshot
        run: sudo env "PATH=$PATH" node --test test/release-snapshot-legacy-state.test.js
      - name: Root-only managed unit preparation
        run: sudo env "PATH=$PATH" node --test test/release-managed-unit-overrides.test.js test/release-installed-managed-unit-preflight.test.js
      - name: Disposable shadow-utils service account lifecycle
        run: sudo env "PATH=$PATH" DP_TEST_REAL_ACCOUNTS=1 node --test test/release-real-clean-install-identities.test.js
      - name: Root-only managed unit installation transaction
        run: sudo env "PATH=$PATH" node --test test/release-install-managed-overrides.test.js
      - name: Root-only candidate activation and fail-closed rollback
        run: sudo env "PATH=$PATH" node --test test/release-activate-managed-release.test.js test/release-writer-start-permit.test.js
      - name: Root-only ingress release and uncertain-resume recovery
        run: sudo env "PATH=$PATH" node --test test/release-open-managed-ingress.test.js test/release-public-admission-probe.test.js
      - name: Root-only pre-exposure recovery staging
        run: sudo env "PATH=$PATH" node --test test/release-stage-pre-exposure-recovery.test.js
      - name: Root-only live recovery destination preflight
        run: sudo env "PATH=$PATH" node --test test/release-inspect-recovery-destinations.test.js
      - name: Root-only original systemd unit recovery staging
        run: sudo env "PATH=$PATH" node --test test/release-restore-systemd-unit-backup.test.js
      - name: Root-only writer reboot guard conditions
        run: sudo env "PATH=$PATH" node --test test/release-writer-boot-guard.test.js test/release-installed-writer-guard-preflight.test.js
      - name: Disposable systemd ingress and writer guard lifecycle
        run: sudo env "PATH=$PATH" DP_TEST_REAL_SYSTEMD=1 node --test test/release-real-systemd-guard-lifecycle.test.js
      - name: Root-only seven-unit migration guard installation
        run: sudo env "PATH=$PATH" node --test test/release-install-migration-boot-guards.test.js
      - name: Disposable seven-unit systemd migration boundary
        run: sudo env "PATH=$PATH" DP_TEST_REAL_SYSTEMD=1 node --test test/release-real-systemd-migration-boundary.test.js
      - name: Disposable clean-install systemd startup and rollback
        run: sudo env "PATH=$PATH" DP_TEST_REAL_SYSTEMD=1 node --test test/release-real-clean-systemd-boundary.test.js
      - name: Disposable real clean-install TCP listener inventory
        run: env DP_TEST_REAL_LISTENERS=1 node --test test/release-real-clean-listeners.test.js
      - name: MCP and Agent systemd lifecycle smoke
        run: sudo env "PATH=$PATH" npm run test:integration:systemd
