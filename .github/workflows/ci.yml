name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, r0003-hotfix-base]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  tmux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - run: npm ci
      - name: Agent and tmux lifecycle smoke
        run: npm run test:integration:tmux

  systemd-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - run: npm ci
      - name: MCP and Agent systemd lifecycle smoke
        run: sudo env "PATH=$PATH" npm run test:integration:systemd
